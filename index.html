<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamble.io Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #08101e;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(420px, 90vw);
      padding: 32px;
      text-align: center;
      background: #13233d;
      border: 1px solid #3c5375;
      border-radius: 18px;
    }

    button {
      margin-top: 15px;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #ffd35d;
      color: #201500;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <h1>Gamble.io Button Test</h1>
    <p id="status">If the button works, this text changes.</p>
    <button id="testButton">Test Button</button>
  </main>

  <script>
    document.getElementById("testButton").addEventListener("click", function () {
      document.getElementById("status").textContent =
        "It worked. GitHub Pages and button clicks are fine.";
      document.body.style.background = "#0b6248";
    });
  </script>
</body>
</html>
